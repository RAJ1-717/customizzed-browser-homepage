<!DOCTYPE html>
<html lang="en" <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Homepage Clone</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- 1. Top Navigation Area -->
    <header>
        <nav class="top-nav">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
            <a href="#" class="menu-icon" aria-label="Google apps">Apps</a>
            <button class="sign-in-btn">Sign in</button>
        </nav>
    </header>

    <!-- 2. Main Search Area -->
    <main>
        <div class="search-container">
            <!-- Google Spiderman Logo -->
            <img src="logo.png" alt="Google Spiderman Logo" class="logo">

            <!-- Search Form -->
            <form action="#">
                <div class="search-box">
                    <span class="search-icon" aria-hidden="true">🔍</span>
                    <input type="text" aria-label="Search" title="Search">
                    <span class="mic-icon" aria-label="Search by voice">🎙️</span>
                </div>

                <!-- Action Buttons -->
                <div class="buttons-container">
                    <button type="submit">Google Search</button>
                    <button type="button">I'm Feeling Lucky</button>
                </div>
            </form>
        </div>
    </main>

    <!-- 3. Footer Links Area -->
    <footer>
        <div class="footer-row location">
            <span>India</span>
        </div>
        <div class="footer-row footer-links">
            <div class="footer-left">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

</body>

</html>
